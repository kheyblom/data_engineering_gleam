directories:
  download: /glade/derecho/scratch/kheyblom/data/gleam/
  logs: ./logs
output_conventions:
  # one store per variable: the layout is the directory, the variable is the
  # name. {variable} renders from the top-level key the scripts set from
  # --variable, so one config addresses all 14 stores of a layout
  filename: '{suffix}/gleam.{version}.{temporal_resolution}.{grid_name}.{variable}.zarr'
  suffix: spatial
log_file: gleam_zarr.log
version: v4.3a
variables: all
temporal_resolution: daily
grid_name: native_0p1x0p1
chunks:
  time: 1
  lat: -1
  lon: -1
timesteps_per_commit: 100
# one process per variable is the parallelism now, so a worker pool inside each
# of 14 processes would oversubscribe the job; the job script refuses to launch
# when processes x num_workers exceeds the cpus it holds
num_workers: 1
file_cache_maxsize: 32
# the raw files are chunked 12 timesteps deep while the store is written one
# timestep at a time, so this has to hold a whole 12 deep row of chunks (302 MiB)
# or HDF5 decompresses each one twelve times over; measured 7.6x end to end.
# Costs file_cache_maxsize x this much memory in the worst case.
chunk_cache_size_mib: 512

# Store global attributes. Every string is templated over the same config fields
# the filename template uses, so {version_label} and friends stay in one place.
# Coverage and grid attributes are not here: derive_attrs reads them off the
# data so they cannot drift from what was actually written.
attrs:
  # ACDD rather than CF, deliberately: see cf_compliance
  Conventions: ACDD-1.3
  cf_compliance: >-
    Not CF compliant. Each variable's standard_name and units are carried
    through unaltered from the upstream GLEAM netCDF files, so the
    standard_name values are descriptive strings rather than CF standard names
    ('Actual evaporation', not 'water_evaporation_flux') and the units are
    spelled 'mm.day-1' and 'm3.m-3', which udunits does not parse. Correcting
    them would mean diverging from upstream, so they are left as published.
  source: >-
    GLEAM {version_label} daily netCDF files: 46 files holding {variable}, one
    per year, 1980-2025
  date_created: '2026-09-10T10:24:11Z'
  creator_name: Kyle Heyblom
  creator_email: heyblom@umich.edu
  references: >-
    https://www.gleam.eu/ -- the dataset citations are in the Reference1 and
    Reference2 attributes carried over from the source files
  chunking: >-
    Chunked (time, lat, lon) = (1, 1800, 3600), float32, zstd: one whole global
    map per chunk, 24.7 MiB. Built for reading maps and fields. A point time
    series is the worst case for this layout, touching all 16802 chunks of this
    store; for time series read the sibling
    temporal/gleam.{version}.{temporal_resolution}.{grid_name}.{variable}.zarr
    instead, which holds the same data chunked (16802, 20, 20).
  # title, summary, history, related_store and known_data_gaps are deliberately
  # absent. Each store carries its own, written per variable when the
  # all-variable store was split, and format_attrs lets a config value override
  # the store -- so a value here would overwrite 14 correct per-variable
  # attributes with a claim to hold fourteen variables.
  #
  # added only once the verifier had actually run against these stores. A store
  # must not carry a claim it has not earned.
  verification: >-
    Verified 2026-09-14 against the source netCDF files by verify_gleam_zarr.py:
    structure, index, sampled value comparisons, a sweep of every chunk in this
    store, physical ranges, and a metadata comparison against the {variable}
    store in the other layout. 0 failures; value comparisons are bit-exact, not
    approximate. Every absent chunk was traced to a raw plane that is entirely fill, so a chunk count below the timestep count is confirmed rather than assumed. The GLEAM component identities -- E against its six
    components, Ep against its two -- are checked from the store holding the
    total, which reads the component stores alongside it.

# Attributes that belong to one variable rather than to the layout, keyed by
# variable and merged over the shared ones above. Only E has any: its upstream
# gap is a property of that variable, and a store must not carry a note about
# data it does not hold.
variable_attrs:
  E:
    known_data_gaps: >-
      This variable is entirely fill (NaN) on 25 days -- five 5-day
      blocks, 1982-02-05..02-09 and 1992-01-01..01-05, 03-21..03-25,
      05-20..05-24 and 10-02..10-06 -- while every other GLEAM variable,
      including E's own components, has data on those days. This is a
      gap in upstream GLEAM {version_label}, not a conversion defect.
      Zarr does not write a chunk whose cells are all fill, so this
      store holds 16777 chunks against 16802 timesteps and that is
      correct.
