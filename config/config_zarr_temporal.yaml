directories:
  download: /glade/derecho/scratch/kheyblom/data/gleam/
  logs: ./logs
output_conventions:
  # one store per variable: the layout is the directory, the variable is the
  # name. {variable} renders from the top-level key the scripts set from
  # --variable, so one config addresses all 14 stores of a layout
  filename: '{suffix}/gleam.{version}.{temporal_resolution}.{grid_name}.{variable}.zarr'
  # sibling of the 'spatial' store built from the same files: same data, same
  # grid, chunked for the opposite access pattern
  suffix: temporal
# not shared with the spatial build, so one store's forensics stay readable
log_file: gleam_zarr_temporal.log
version: v4.3a
variables: all
temporal_resolution: daily
grid_name: native_0p1x0p1
# one chunk holds a 2 x 2 degree tile through the whole 46 year record, 25.6 MiB
# of float32. A point time series is one chunk; a global map is 16200 of them
chunks:
  time: -1
  lat: 20
  lon: 20
# a store chunked across the whole time axis has no append boundary to stop at,
# so it is written as a skeleton and filled in place, one block per commit
write_strategy: region
# the read and commit unit. Two things decide it, and locality matters more
# than volume. It has to be much wider than a chunk, because the raw files are
# chunked [12, 57, 113] and a block only 20 cells wide would decompress each
# 57 x 113 source chunk once per tile it covers. And it has to span lon
# *entirely*: a block narrower than the globe reads a strided subset of the
# source chunks -- 11 of every 32 along lon, scattered through the file -- which
# measured pathologically slow on dense variables even though the volume was the
# same. Full lon turns every read into contiguous runs of 32 source chunks.
# At lat: 200 that is 45.1 GiB resident per block against 1.43x read
# amplification, a trade worth making because Derecho bills cpus, not memory.
block_shape:
  lat: 200
  lon: -1
# the region path reads one block a time chunk at a time, a serial loop behind
# one process global HDF5 lock, so this buys nothing here -- the tier-2 bench
# measured 0.47 cores while it was billing 2. Matched to ncpus=1, which is what
# the production chain asks for, so the job script's oversubscription guard
# cannot trip on a shared node that reports fewer cpus than expected.
num_workers: 1
# a block reads every file of one variable, not two year files per variable
file_cache_maxsize: 64
# 64 rather than the append path's 512. A block is one contiguous hyperslab per
# file, so every source chunk it touches is decompressed once regardless and the
# cache is not doing the job it does there. What it does do is multiply: at 46
# files open it was holding 23.6 GB, which is most of the way to a job's memory
# cap on its own. Costs file_cache_maxsize x this much memory in the worst case.
chunk_cache_size_mib: 64

# Store global attributes. Every string is templated over the same config fields
# the filename template uses, so {version_label} and friends stay in one place.
# Coverage and grid attributes are not here: derive_attrs reads them off the
# data so they cannot drift from what was actually written.
attrs:
  # ACDD rather than CF, deliberately: see cf_compliance
  Conventions: ACDD-1.3
  cf_compliance: >-
    Not CF compliant. Each variable's standard_name and units are carried
    through unaltered from the upstream GLEAM netCDF files, so the
    standard_name values are descriptive strings rather than CF standard names
    ('Actual evaporation', not 'water_evaporation_flux') and the units are
    spelled 'mm.day-1' and 'm3.m-3', which udunits does not parse. Correcting
    them would mean diverging from upstream, so they are left as published.
  source: >-
    GLEAM {version_label} daily netCDF files: 46 files holding {variable}, one
    per year, 1980-2025
  date_created: '2026-09-13T11:59:50Z'
  creator_name: Kyle Heyblom
  creator_email: heyblom@umich.edu
  references: >-
    https://www.gleam.eu/ -- the dataset citations are in the Reference1 and
    Reference2 attributes carried over from the source files
  chunking: >-
    Chunked (time, lat, lon) = (16802, 20, 20), float32, zstd: one 2 x 2 degree
    tile through the whole 46 year record per chunk, 25.6 MiB. Built for reading
    time series -- a series at any point is a single chunk. A global map is the
    worst case for this layout, touching all 16200 chunks of this store; for
    maps and fields read the sibling
    spatial/gleam.{version}.{temporal_resolution}.{grid_name}.{variable}.zarr
    instead, which holds the same data chunked (1, 1800, 3600).
  # title, summary, history, related_store and known_data_gaps are deliberately
  # absent. Each store carries its own, written per variable when the
  # all-variable store was split, and format_attrs lets a config value override
  # the store -- so a value here would overwrite 14 correct per-variable
  # attributes with a claim to hold fourteen variables.
  #
  # added only once the verifier had actually run against these stores. A store
  # must not carry a claim it has not earned.
  verification: >-
    Verified 2026-09-14 against the source netCDF files by verify_gleam_zarr.py:
    structure, index, sampled value comparisons, a sweep of every chunk in this
    store, physical ranges, and a metadata comparison against the {variable}
    store in the other layout. 0 failures; value comparisons are bit-exact, not
    approximate. Absent chunks are cross-checked against the manifests of the other 13 variables, and every tile that another variable wrote was read from raw across the whole record to confirm it really is empty here. The GLEAM component identities -- E against its six
    components, Ep against its two -- are checked from the store holding the
    total, which reads the component stores alongside it.
